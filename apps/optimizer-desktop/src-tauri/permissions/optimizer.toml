[[permission]]
identifier = "allow-project-session"
description = "Allows the bundled editor to create, open, close and inspect one local project session."
commands.allow = ["create_project", "open_project", "close_project", "get_project_session"]

[[permission]]
identifier = "allow-recent-projects"
description = "Allows the bundled welcome page to list, reopen and forget host-maintained recent project metadata."
commands.allow = ["list_recent_projects", "open_recent_project", "remove_recent_project"]

[[permission]]
identifier = "allow-user-locale"
description = "Allows the bundled editor to read and persist the host-owned user UI locale preference."
commands.allow = ["set_user_locale", "get_user_locale"]

[[permission]]
identifier = "allow-workspace-read"
description = "Allows the bundled editor to read the document tree and blocks from the current project session."
commands.allow = ["get_project_workspace"]

[[permission]]
identifier = "allow-style-library"
description = "Allows the bundled editor to list, create, archive and restore project style samples without direct database access."
commands.allow = ["list_style_samples", "create_style_sample", "set_style_sample_status"]

[[permission]]
identifier = "allow-knowledge-library"
description = "Allows the bundled editor to maintain project facts and constraints and collect only current target-bound canonical knowledge context."
commands.allow = ["list_knowledge_items", "create_knowledge_item", "set_knowledge_item_status", "get_knowledge_context"]

[[permission]]
identifier = "allow-operation-context"
description = "Allows the bundled editor to collect current target-bound Context candidates from authoritative document, structure, summary, knowledge and style sources."
commands.allow = ["get_operation_context"]

[[permission]]
identifier = "allow-workspace-write"
description = "Allows the bundled editor to create a chapter, save a block through optimistic concurrency and create audit commits."
commands.allow = ["create_document", "save_block", "apply_reviewed_proposal"]

[[permission]]
identifier = "allow-document-lifecycle"
description = "Allows the bundled editor to list archived chapters and commit chapter rename, sibling reorder, hierarchy and archive/restore mutations."
commands.allow = ["list_archived_documents", "rename_document", "reorder_document", "change_document_depth", "set_document_archived"]

[[permission]]
identifier = "allow-summary-status-read"
description = "Allows the bundled editor to inspect coalesced summary invalidation metadata without reading generated summaries."
commands.allow = ["list_summary_invalidations"]

[[permission]]
identifier = "allow-summary-worker"
description = "Allows the bundled editor to run the host-owned local summary worker and collect current, target-bound summary context."
commands.allow = ["refresh_summaries", "get_summary_context"]

[[permission]]
identifier = "allow-project-export"
description = "Allows the bundled editor to atomically export the current project as Markdown, JSON or a diagnostics bundle inside its project package."
commands.allow = ["export_markdown", "export_json", "export_diagnostics"]

[[permission]]
identifier = "allow-version-read"
description = "Allows the bundled editor to list commits, safe checkpoint metadata, timeline events and document diffs across snapshots for the current project."
commands.allow = ["get_version_history", "list_timeline_events", "compare_documents"]

[[permission]]
identifier = "allow-version-write"
description = "Allows the bundled editor to create and restore verified project checkpoints."
commands.allow = ["create_checkpoint", "restore_checkpoint"]

[[permission]]
identifier = "allow-project-backup"
description = "Allows the bundled editor to export the current project as a .optimizer-backup zip archive and restore a backup archive into a new project package."
commands.allow = ["export_project_backup", "import_project_backup"]

[[permission]]
identifier = "allow-operation-write"
description = "Allows the bundled editor to persist final operation bundles and append optimistic review events."
commands.allow = ["persist_operation_bundle", "append_review_event"]

[[permission]]
identifier = "allow-operation-audit-read"
description = "Allows the bundled editor to read the complete audit record for one operation run."
commands.allow = ["get_operation_audit"]

[[permission]]
identifier = "allow-operation-insights-read"
description = "Allows the bundled editor to read aggregated operation insights and recent run summaries for the current project."
commands.allow = ["get_operation_insights"]

[[permission]]
identifier = "allow-review-candidate-read"
description = "Allows the bundled editor to list project-scoped review candidates and reload one immutable proposal with its replayed decisions."
commands.allow = ["list_review_candidates", "load_review_candidate"]

[[permission]]
identifier = "allow-review-candidate-branch"
description = "Allows one ready reviewed proposal to create an immutable snapshot-backed candidate branch without moving the main project head."
commands.allow = ["create_review_candidate_branch"]

[[permission]]
identifier = "allow-provider-secret-manage"
description = "Allows write, presence check and deletion of provider secrets without exposing plaintext reads."
commands.allow = ["store_provider_secret", "has_provider_secret", "delete_provider_secret"]

[[permission]]
identifier = "allow-trusted-model-endpoints"
description = "Allows the bundled settings UI to list, explicitly trust and remove Host-owned public HTTPS OpenAI-compatible endpoints, and run a bounded models probe against one registered endpoint."
commands.allow = ["list_trusted_model_endpoints", "register_trusted_model_endpoint", "remove_trusted_model_endpoint", "list_openai_compatible_models"]

[[permission]]
identifier = "allow-model-execution"
description = "Allows the bundled editor to authorize and consume one short-lived Host-resolved model request, cancel active or pending requests and list fixed-loopback Ollama models."
commands.allow = ["authorize_model_request", "execute_authorized_model_stream", "cancel_model_request", "list_ollama_models"]
