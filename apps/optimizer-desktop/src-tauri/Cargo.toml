[package]
name = "optimizer-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Tauri IPC adapter for the Optimizer System"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", default-features = false }

[dependencies]
optimizer-host = { path = "../../../crates/optimizer-host" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.2", default-features = false, features = ["wry"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "optimizer-desktop"
path = "src/main.rs"
test = false
bench = false
