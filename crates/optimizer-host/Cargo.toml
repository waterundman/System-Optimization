[package]
name = "optimizer-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Host security boundary for the Optimizer System"

[dependencies]
optimizer-store = { path = "../optimizer-store" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[lib]
path = "src/lib.rs"
